<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="150" viewBox="0 0 1280 150" role="img" aria-labelledby="t">
  <title id="t">Game over. Insert coin to play again.</title>
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe08a"/><stop offset=".45" stop-color="#ffc83d"/><stop offset="1" stop-color="#b8740f"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="2" fill="#fff" opacity=".04"/></pattern>
  </defs>
  <rect x="6" y="6" width="1268" height="138" rx="20" fill="#090d1a"/>
  <rect x="6" y="6" width="1268" height="138" rx="20" fill="url(#scan)"/>
  <text x="640" y="76" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif" font-style="italic" font-weight="900"
        font-size="54" fill="#f4f1de">GAME <tspan fill="#ffc83d">OVER</tspan></text>
  <text x="640" y="112" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="17" font-weight="700"
        letter-spacing="6" fill="#2fb36a">INSERT COIN TO PLAY AGAIN ▸ NEXT SEASON LOADING…</text>
  <rect x="6" y="6" width="1268" height="138" rx="20" fill="none" stroke="url(#rim)" stroke-width="5"/>
</svg>
