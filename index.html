      /* first paint before the app's script arrives: the pixel football (same art as ui/PixelLoader) hops on the night background; React replaces it */
      html,body{background:#080c18}
      .boot{min-height:70vh;display:flex;align-items:center;justify-content:center;opacity:0;animation:boot-in .3s ease-out .25s forwards}
      .boot svg{width:48px;height:27px;image-rendering:pixelated;animation:boot-hop .64s infinite cubic-bezier(.25,.6,.4,1)}

      @keyframes boot-hop{50%{transform:translateY(-14px) rotate(180deg)}to{transform:translateY(0) rotate(360deg)}}
      @media (prefers-reduced-motion:reduce){.boot svg{animation:none}}
