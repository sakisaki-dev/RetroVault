    <!-- Pre-JS boot splash: inline CSS and HTML only, painted with the first bytes of the page. Nothing render-blocking
         sits before it: the Google Fonts sheet loads without blocking and the build makes the app's own stylesheet
         non-blocking too (vite.config.ts). main.tsx calls __rvBootDone() after React's first commit and once the
         stylesheet is in; the splash then fades and fires rv:boot-lift (the page entrance cascade waits for it).
         The splash is the one piece to swap for a new loader: keep #rv-boot, __rvBootDone and lift(). -->
    <style>
      html,body{background:#080c18;margin:0}
      #rv-boot{position:fixed;inset:0;z-index:2147483000;background:#080c18;display:flex;align-items:center;justify-content:center;transition:opacity .3s ease-out}
      #rv-boot.fade{opacity:0;pointer-events:none}
      #rv-boot svg{width:48px;height:27px;image-rendering:pixelated;animation:boot-hop .64s infinite cubic-bezier(.25,.6,.4,1)}
      #rv-boot p{position:absolute;left:24px;right:24px;bottom:12%;margin:0;font:500 13px/1.4 -apple-system,system-ui,sans-serif;color:#9aa4bd;text-align:center;opacity:0;transition:opacity .4s}
      #rv-boot p.on{opacity:1}
      @keyframes boot-hop{50%{transform:translateY(-14px) rotate(180deg)}to{transform:translateY(0) rotate(360deg)}}
      @media (prefers-reduced-motion:reduce){#rv-boot svg{animation:none}}
    </style>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,700;1,800&family=Barlow:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Silkscreen:wght@400;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" onload="this.onload=null;this.rel='stylesheet'" />

    <div id="root"></div>
    <script>
      (function(){
        var b=document.getElementById("rv-boot"),m=document.getElementById("rv-boot-msg"),done=false,lifted=false;
        setTimeout(function(){if(!done){m.className="on";m.textContent="Slow connection, still loading"}},5000);
        function lift(){if(lifted)return;lifted=true;window.__rvBootLifted=true;try{dispatchEvent(new Event("rv:boot-lift"))}catch(e){}}
        function open(){
          if(done)return;done=true;lift();b.className="fade";
          setTimeout(function(){if(b.parentNode)b.parentNode.removeChild(b)},350);
        }
        window.__rvBootDone=function(){
          if(done)return;
          var l=document.querySelector("link[data-app-css]");
          if(!l||l.dataset.ok){open();return}
          l.addEventListener("load",open);l.addEventListener("error",open);setTimeout(open,15000)
        };
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
